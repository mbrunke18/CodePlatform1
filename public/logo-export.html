<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:600px;height:600px;background:#0A0F2E;display:flex;align-items:center;justify-content:center;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .wrap{display:flex;flex-direction:column;align-items:center;gap:20px}
  .seal{
    width:220px;height:220px;border-radius:50%;
    background:radial-gradient(circle at 38% 38%,#1e2d6e,#0A0F2E);
    border:2px solid #C9A84C;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:6px;
  }
  .vm{font-family:Georgia,serif;font-weight:700;font-size:44px;color:#C9A84C;letter-spacing:.04em}
  .wordmark{display:flex;flex-direction:column;align-items:center;gap:5px}
  .name{font-family:Georgia,serif;font-weight:600;font-size:32px;color:#fff;letter-spacing:.01em}
  .sub{font-family:Arial,sans-serif;font-weight:700;font-size:11px;letter-spacing:.38em;text-transform:uppercase;color:#C9A84C}
  .rule{width:160px;height:1px;background:linear-gradient(90deg,transparent,#C9A84C,transparent);margin:2px 0}
</style>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Barlow+Condensed:wght@700&display=swap" rel="stylesheet">
</head>
<body>
<div class="wrap">
  <div class="seal">
    <span style="font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;font-size:52px;color:#C9A84C;letter-spacing:.04em">VM</span>
  </div>
  <div class="wordmark">
    <span style="font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:36px;color:#fff;letter-spacing:.01em">VaughnMartin</span>
    <div class="rule"></div>
    <span style="font-family:'Barlow Condensed',Arial,sans-serif;font-weight:700;font-size:12px;letter-spacing:.38em;text-transform:uppercase;color:#C9A84C">READINESS OS</span>
  </div>
</div>
</body>
</html>
