<svg width="400" height="400" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1a2860"/>
      <stop offset="100%" stop-color="#0A0F2E"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFC178"/>
      <stop offset="50%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#8B6212"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="100" cy="100" r="86" fill="url(#bgGrad)"/>

  <!-- Outer rings -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="#C9A84C" stroke-width="1" opacity="0.85"/>
  <circle cx="100" cy="100" r="84" fill="none" stroke="#C9A84C" stroke-width="0.4" opacity="0.2"/>

  <!-- Tick marks — 36 around the ring -->
  <line x1="100" y1="12" x2="100" y2="20" stroke="#C9A84C" stroke-width="1.5" opacity="0.85"/>
  <line x1="125.9" y1="13.8" x2="123.5" y2="21.5" stroke="#00E5C4" stroke-width="0.6" opacity="0.22"/>
  <line x1="150" y1="19.4" x2="145.7" y2="26.1" stroke="#00E5C4" stroke-width="0.6" opacity="0.22"/>
  <line x1="171" y1="29" x2="165" y2="34.2" stroke="#00E5C4" stroke-width="0.6" opacity="0.22"/>
  <line x1="187.3" y1="42.5" x2="180.2" y2="46.4" stroke="#00E5C4" stroke-width="0.6" opacity="0.22"/>
  <line x1="197.3" y1="58.6" x2="189.8" y2="61.1" stroke="#00E5C4" stroke-width="0.6" opacity="0.22"/>
  <line x1="200.5" y1="76.5" x2="192.8" y2="77.6" stroke="#00E5C4" stroke-width="0.6" opacity="0.22"/>
  <line x1="196.8" y1="94.6" x2="189.2" y2="94.2" stroke="#00E5C4" stroke-width="0.6" opacity="0.22"/>
  <line x1="186" y1="112" x2="179.3" y2="109.8" stroke="#C9A84C" stroke-width="1.5" opacity="0.85"/>
  <line x1="168.9" y1="127.1" x2="163.4" y2="123.1" stroke="#00E5C4" stroke-width="0.6" opacity="0.22"/>
  <line x1="147.4" y1="138.9" x2="143.1" y2="133.6" stroke="#00E5C4" stroke-width="0.6" opacity="0.22"/>
  <line x1="123.3" y1="146.3" x2="120.3" y2="140.2" stroke="#00E5C4" stroke-width="0.6" opacity="0.22"/>
  <line x1="98.2" y1="148.9" x2="96.5" y2="142.6" stroke="#00E5C4" stroke-width="0.6" opacity="0.22"/>
  <line x1="73.4" y1="146.3" x2="73.1" y2="139.8" stroke="#00E5C4" stroke-width="0.6" opacity="0.22"/>
  <line x1="50.5" y1="138.6" x2="51.8" y2="132.3" stroke="#00E5C4" stroke-width="0.6" opacity="0.22"/>
  <line x1="30.9" y1="126.5" x2="33.8" y2="120.9" stroke="#00E5C4" stroke-width="0.6" opacity="0.22"/>
  <line x1="14" y1="110.5" x2="18.3" y2="106.3" stroke="#C9A84C" stroke-width="1.5" opacity="0.85"/>
  <line x1="3.6" y1="91.2" x2="9.1" y2="88.5" stroke="#00E5C4" stroke-width="0.6" opacity="0.22"/>
  <line x1="0.4" y1="70.3" x2="6.8" y2="69.4" stroke="#00E5C4" stroke-width="0.6" opacity="0.22"/>
  <line x1="4.8" y1="50.1" x2="11" y2="51" stroke="#00E5C4" stroke-width="0.6" opacity="0.22"/>
  <line x1="16.2" y1="31.8" x2="21.8" y2="34.3" stroke="#00E5C4" stroke-width="0.6" opacity="0.22"/>
  <line x1="33.4" y1="17.4" x2="37.8" y2="21.1" stroke="#00E5C4" stroke-width="0.6" opacity="0.22"/>
  <line x1="55.3" y1="7.8" x2="58" y2="12.8" stroke="#00E5C4" stroke-width="0.6" opacity="0.22"/>
  <line x1="79.5" y1="3.4" x2="80.6" y2="8.8" stroke="#00E5C4" stroke-width="0.6" opacity="0.22"/>

  <!-- Cardinal diamonds at N S E W -->
  <polygon points="100,6 104,10 100,14 96,10" fill="url(#goldGrad)"/>
  <polygon points="190,100 194,104 190,108 186,104" fill="url(#goldGrad)"/>
  <polygon points="100,186 104,190 100,194 96,190" fill="url(#goldGrad)"/>
  <polygon points="6,100 10,104 6,108 2,104" fill="url(#goldGrad)"/>

  <!-- VM monogram -->
  <text x="100" y="114" text-anchor="middle"
    font-family="Georgia, serif"
    font-size="52" font-weight="700"
    fill="url(#goldGrad)"
    filter="url(#glow)"
    letter-spacing="-2">VM</text>

  <!-- Signal pulse dot -->
  <circle cx="100" cy="156" r="3.6" fill="#00E5C4" opacity="0.8" filter="url(#glow)"/>

  <!-- Top arc: VAUGHNMARTIN · READINESS OS -->
  <path id="topArc" d="M 29.5,100 A 70.5,70.5 0 0,1 170.5,100" fill="none"/>
  <text font-family="'Courier New', monospace" font-size="11" fill="#C9A84C" opacity="0.85" text-anchor="middle">
    <textPath href="#topArc" startOffset="50%">VAUGHNMARTIN · READINESS OS</textPath>
  </text>

  <!-- Bottom arc: ANTE IGNEM PARATUS -->
  <path id="botArc" d="M 36.4,100 A 63.6,63.6 0 0,0 163.6,100" fill="none"/>
  <text font-family="'Courier New', monospace" font-size="9.5" fill="#3BAF8A" opacity="0.7" text-anchor="middle">
    <textPath href="#botArc" startOffset="50%">ANTE IGNEM PARATUS</textPath>
  </text>
</svg>
