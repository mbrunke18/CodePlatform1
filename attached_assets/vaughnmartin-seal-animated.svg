  <line x1="32.59"  y1="43.43"  x2="36.42"  y2="46.65"  stroke="#00E5C4" stroke-width="0.6" opacity="0.22"/>
  <line x1="43.43"  y1="32.59"  x2="46.65"  y2="36.42"  stroke="#00E5C4" stroke-width="0.6" opacity="0.22"/>
