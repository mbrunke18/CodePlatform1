  <line x1="84.72"  y1="13.34"  x2="85.59"  y2="18.26"  stroke="#00E5C4" stroke-width="0.6" opacity="0.22"/>

  <!-- Cardinal diamonds N · E · S · W -->
  <polygon points="100.00,4.00 104.00,8.00 100.00,12.00 96.00,8.00"        fill="url(#goldG)"/>
  <polygon points="192.00,96.00 196.00,100.00 192.00,104.00 188.00,100.00" fill="url(#goldG)"/>
  <polygon points="100.00,188.00 104.00,192.00 100.00,196.00 96.00,192.00" fill="url(#goldG)"/>
  <polygon points="8.00,96.00 12.00,100.00 8.00,104.00 4.00,100.00"        fill="url(#goldG)"/>

  <!-- ── Radar sweep — SMIL animateTransform (works in all SVG viewers) ── -->
  <g>
    <!-- Trailing cone (faint sweep trail) -->
    <path d="M 100,100 L 100,22.60 A 77.40,77.40 0 0,1 132.71,29.85 Z"
      fill="#00E5C4" opacity="0.08"/>
    <!-- Scan beam -->
    <line x1="100" y1="100" x2="100" y2="22.60"
      stroke="#00E5C4" stroke-width="1.6" opacity="0.75" filter="url(#glow)"/>
    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 100 100"
      to="360 100 100"
      dur="12s"
      repeatCount="indefinite"/>
  </g>

  <!-- VM monogram — rendered above the radar so it is never obscured -->
  <text x="100" y="114" text-anchor="middle"
    font-family="Georgia, serif"
    font-size="52" font-weight="700"
    fill="url(#goldG)"
    filter="url(#glow)"
    letter-spacing="-2">VM</text>

  <!-- Signal pulse dot with radius pulse + opacity pulse -->
  <circle cx="100" cy="156" r="3.6" fill="#00E5C4" filter="url(#glow)">
    <animate attributeName="opacity" values="0.35;1.0;0.35" dur="2.62s" repeatCount="indefinite"/>
    <animate attributeName="r"       values="3.0;4.4;3.0"   dur="2.62s" repeatCount="indefinite"/>
  </circle>

  <!-- Top arc: VAUGHNMARTIN · READINESS OS -->
  <path id="topArc" d="M 29.48,100 A 70.52,70.52 0 0,1 170.52,100" fill="none"/>
  <text font-family="'Courier New', monospace" font-size="11"
    fill="#C9A84C" opacity="0.85" text-anchor="middle">
    <textPath href="#topArc" startOffset="50%">VAUGHNMARTIN · READINESS OS</textPath>
  </text>

  <!-- Bottom arc: ANTE IGNEM PARATUS -->
  <path id="botArc" d="M 36.36,100 A 63.64,63.64 0 0,0 163.64,100" fill="none"/>
  <text font-family="'Courier New', monospace" font-size="9.5"
    fill="#3BAF8A" opacity="0.7" text-anchor="middle">
    <textPath href="#botArc" startOffset="50%">ANTE IGNEM PARATUS</textPath>
  </text>

</svg>
