<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="400" viewBox="0 0 200 200"
  xmlns="http://www.w3.org/2000/svg">

  <defs>
    <radialGradient id="grad" cx="50%" cy="30%" r="70%">
      <stop offset="0%"  stop-color="#1a2860"/>
      <stop offset="100%" stop-color="#0A0F2E"/>
    </radialGradient>
    <linearGradient id="goldG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#DFC178"/>
      <stop offset="50%"  stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#8B6212"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background fill -->
  <circle cx="100" cy="100" r="86" fill="url(#grad)"/>

  <!-- Outer rings -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="#C9A84C"  stroke-width="1"   opacity="0.85"/>
  <circle cx="100" cy="100" r="84" fill="none" stroke="#00E5C4"  stroke-width="0.6" opacity="0.25"/>
  <circle cx="100" cy="100" r="81" fill="none" stroke="#C9A84C"  stroke-width="0.4" opacity="0.2"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="#00E5C4"  stroke-width="0.4" stroke-dasharray="10 30" opacity="0.1"/>

  <!-- Tick marks (36 · major gold at 12/3/6/9 o'clock) -->
  <line x1="100.00" y1="12.00" x2="100.00" y2="20.00" stroke="#C9A84C" stroke-width="1.5" opacity="0.85"/>
  <line x1="115.28" y1="13.34" x2="114.41" y2="18.26" stroke="#00E5C4" stroke-width="0.6" opacity="0.22"/>
  <line x1="130.10" y1="17.31" x2="128.39" y2="22.01" stroke="#00E5C4" stroke-width="0.6" opacity="0.22"/>
  <line x1="144.00" y1="23.79" x2="141.50" y2="28.12" stroke="#00E5C4" stroke-width="0.6" opacity="0.22"/>
  <line x1="156.57" y1="32.59" x2="153.35" y2="36.42" stroke="#00E5C4" stroke-width="0.6" opacity="0.22"/>
  <line x1="167.41" y1="43.43" x2="163.58" y2="46.65" stroke="#00E5C4" stroke-width="0.6" opacity="0.22"/>
  <line x1="176.21" y1="56.00" x2="171.88" y2="58.50" stroke="#00E5C4" stroke-width="0.6" opacity="0.22"/>
  <line x1="182.69" y1="69.90" x2="177.99" y2="71.61" stroke="#00E5C4" stroke-width="0.6" opacity="0.22"/>
  <line x1="186.66" y1="84.72" x2="181.74" y2="85.59" stroke="#00E5C4" stroke-width="0.6" opacity="0.22"/>
  <line x1="188.00" y1="100.00" x2="180.00" y2="100.00" stroke="#C9A84C" stroke-width="1.5" opacity="0.85"/>
  <line x1="186.66" y1="115.28" x2="181.74" y2="114.41" stroke="#00E5C4" stroke-width="0.6" opacity="0.22"/>
  <line x1="182.69" y1="130.10" x2="177.99" y2="128.39" stroke="#00E5C4" stroke-width="0.6" opacity="0.22"/>
  <line x1="176.21" y1="144.00" x2="171.88" y2="141.50" stroke="#00E5C4" stroke-width="0.6" opacity="0.22"/>
  <line x1="167.41" y1="156.57" x2="163.58" y2="153.35" stroke="#00E5C4" stroke-width="0.6" opacity="0.22"/>
  <line x1="156.57" y1="167.41" x2="153.35" y2="163.58" stroke="#00E5C4" stroke-width="0.6" opacity="0.22"/>
  <line x1="144.00" y1="176.21" x2="141.50" y2="171.88" stroke="#00E5C4" stroke-width="0.6" opacity="0.22"/>
  <line x1="130.10" y1="182.69" x2="128.39" y2="177.99" stroke="#00E5C4" stroke-width="0.6" opacity="0.22"/>
  <line x1="115.28" y1="186.66" x2="114.41" y2="181.74" stroke="#00E5C4" stroke-width="0.6" opacity="0.22"/>
  <line x1="100.00" y1="188.00" x2="100.00" y2="180.00" stroke="#C9A84C" stroke-width="1.5" opacity="0.85"/>
  <line x1="84.72"  y1="186.66" x2="85.59"  y2="181.74" stroke="#00E5C4" stroke-width="0.6" opacity="0.22"/>
  <line x1="69.90"  y1="182.69" x2="71.61"  y2="177.99" stroke="#00E5C4" stroke-width="0.6" opacity="0.22"/>
  <line x1="56.00"  y1="176.21" x2="58.50"  y2="171.88" stroke="#00E5C4" stroke-width="0.6" opacity="0.22"/>
  <line x1="43.43"  y1="167.41" x2="46.65"  y2="163.58" stroke="#00E5C4" stroke-width="0.6" opacity="0.22"/>
  <line x1="32.59"  y1="156.57" x2="36.42"  y2="153.35" stroke="#00E5C4" stroke-width="0.6" opacity="0.22"/>
  <line x1="23.79"  y1="144.00" x2="28.12"  y2="141.50" stroke="#00E5C4" stroke-width="0.6" opacity="0.22"/>
  <line x1="17.31"  y1="130.10" x2="22.01"  y2="128.39" stroke="#00E5C4" stroke-width="0.6" opacity="0.22"/>
  <line x1="13.34"  y1="115.28" x2="18.26"  y2="114.41" stroke="#00E5C4" stroke-width="0.6" opacity="0.22"/>
  <line x1="12.00"  y1="100.00" x2="20.00"  y2="100.00" stroke="#C9A84C" stroke-width="1.5" opacity="0.85"/>
  <line x1="13.34"  y1="84.72"  x2="18.26"  y2="85.59"  stroke="#00E5C4" stroke-width="0.6" opacity="0.22"/>
