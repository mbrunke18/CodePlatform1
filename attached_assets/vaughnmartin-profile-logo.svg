  <!-- Gold bar — ANTE IGNEM PARATUS (exact homepage treatment) -->
  <rect x="20" y="292" width="360" height="44" fill="url(#mottoG)"/>
  <text x="200" y="321" text-anchor="middle"
    font-family="Georgia, serif" font-size="14.5" font-weight="700"
    fill="#0A0F2E" letter-spacing="0.3em">ANTE IGNEM PARATUS</text>

  <!-- Teal motto line -->
  <text x="200" y="356" text-anchor="middle"
    font-family="'Courier New', monospace" font-size="9" font-weight="600"
    fill="rgba(0,229,196,0.65)" letter-spacing="0.12em">PREPARE · PRACTICE · PERFORM FEARLESS · NEVER GIVE UP</text>

  <!-- READINESS OS identifier -->
  <text x="200" y="388" text-anchor="middle"
    font-family="'Courier New', monospace" font-size="10" font-weight="700"
    fill="#C9A84C" opacity="0.45" letter-spacing="0.3em">READINESS OS</text>

