<?xml version="1.0" encoding="UTF-8"?>
<!-- VaughnMartin Profile Logo — 400×400 — matches homepage hero right-column treatment -->
<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="mottoG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#8B6212"/>
      <stop offset="50%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#8B6212"/>
    </linearGradient>
  </defs>

  <!-- Navy background -->
  <rect width="400" height="400" fill="#0A0F2E"/>

  <!-- Subtle radial glow behind seal -->
  <ellipse cx="200" cy="148" rx="190" ry="170" fill="#1a2860" opacity="0.6"/>

