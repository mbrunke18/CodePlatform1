      <line x1="100" y1="100" x2="100" y2="22.60" stroke="#00E5C4" stroke-width="1.6" opacity="0.75" filter="url(#pglow)"/>
      <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="12s" repeatCount="indefinite"/>
    </g>

    <text x="100" y="114" text-anchor="middle" font-family="Georgia, serif" font-size="52" font-weight="700" fill="url(#pgg)" filter="url(#pglow)" letter-spacing="-2">VM</text>

    <circle cx="100" cy="156" r="3.6" fill="#00E5C4" filter="url(#pglow)">
      <animate attributeName="opacity" values="0.2;0.2;0.2;1.0;0.2;0.2;0.2" keyTimes="0;0.42;0.47;0.50;0.53;0.58;1" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="r"       values="3;3;3;5.5;3;3;3"             keyTimes="0;0.42;0.47;0.50;0.53;0.58;1" dur="12s" repeatCount="indefinite"/>
    </circle>

    <path id="pta" d="M 29.48,100 A 70.52,70.52 0 0,1 170.52,100" fill="none"/>
    <text font-family="'Courier New', monospace" font-size="11" fill="#C9A84C" opacity="0.85" text-anchor="middle">
