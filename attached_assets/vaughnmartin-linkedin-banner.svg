<?xml version="1.0" encoding="UTF-8"?>
<!-- LinkedIn Background Banner — 1584 × 396 px -->
<svg width="1584" height="396" viewBox="0 0 1584 396"
  xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Navy background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#0A0F2E"/>
      <stop offset="60%"  stop-color="#0e1640"/>
      <stop offset="100%" stop-color="#0A0F2E"/>
    </linearGradient>

    <!-- Seal radial fill -->
    <radialGradient id="sealGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%"  stop-color="#1a2860"/>
      <stop offset="100%" stop-color="#0A0F2E"/>
    </radialGradient>

    <!-- Gold gradient -->
    <linearGradient id="goldG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#DFC178"/>
      <stop offset="50%"  stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#8B6212"/>
    </linearGradient>

    <!-- Teal gradient for accent rule -->
    <linearGradient id="tealFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#2B8A6E" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#2B8A6E" stop-opacity="1"/>
      <stop offset="100%" stop-color="#2B8A6E" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Glow filter for seal elements -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Gold bar gradient — matches homepage ANTE IGNEM PARATUS treatment -->
    <linearGradient id="mottoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#8B6212"/>
      <stop offset="50%"  stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#8B6212"/>
    </linearGradient>

    <!-- Soft clip for the whole banner -->
    <clipPath id="bannerClip">
      <rect width="1584" height="396"/>
    </clipPath>
  </defs>

  <g clip-path="url(#bannerClip)">

    <!-- ── Background ─────────────────────────────────────────── -->
    <rect width="1584" height="396" fill="url(#bgGrad)"/>

    <!-- Gold grid overlay (matches homepage dark section treatment) -->
    <rect width="1584" height="396" fill="none"
      style="background-image: repeating-linear-gradient(0deg,rgba(201,168,76,0.06) 0px,rgba(201,168,76,0.06) 1px,transparent 1px,transparent 56px),repeating-linear-gradient(90deg,rgba(201,168,76,0.06) 0px,rgba(201,168,76,0.06) 1px,transparent 1px,transparent 56px)"/>
    <!-- Manual grid lines horizontal -->
    <line x1="0" y1="56"  x2="1584" y2="56"  stroke="#C9A84C" stroke-width="0.5" opacity="0.07"/>
    <line x1="0" y1="112" x2="1584" y2="112" stroke="#C9A84C" stroke-width="0.5" opacity="0.07"/>
    <line x1="0" y1="168" x2="1584" y2="168" stroke="#C9A84C" stroke-width="0.5" opacity="0.07"/>
    <line x1="0" y1="224" x2="1584" y2="224" stroke="#C9A84C" stroke-width="0.5" opacity="0.07"/>
    <line x1="0" y1="280" x2="1584" y2="280" stroke="#C9A84C" stroke-width="0.5" opacity="0.07"/>
    <line x1="0" y1="336" x2="1584" y2="336" stroke="#C9A84C" stroke-width="0.5" opacity="0.07"/>
    <!-- Manual grid lines vertical -->
    <line x1="112"  y1="0" x2="112"  y2="396" stroke="#C9A84C" stroke-width="0.5" opacity="0.07"/>
    <line x1="224"  y1="0" x2="224"  y2="396" stroke="#C9A84C" stroke-width="0.5" opacity="0.07"/>
    <line x1="336"  y1="0" x2="336"  y2="396" stroke="#C9A84C" stroke-width="0.5" opacity="0.07"/>
    <line x1="448"  y1="0" x2="448"  y2="396" stroke="#C9A84C" stroke-width="0.5" opacity="0.07"/>
    <line x1="560"  y1="0" x2="560"  y2="396" stroke="#C9A84C" stroke-width="0.5" opacity="0.07"/>
    <line x1="672"  y1="0" x2="672"  y2="396" stroke="#C9A84C" stroke-width="0.5" opacity="0.07"/>
    <line x1="784"  y1="0" x2="784"  y2="396" stroke="#C9A84C" stroke-width="0.5" opacity="0.07"/>
    <line x1="896"  y1="0" x2="896"  y2="396" stroke="#C9A84C" stroke-width="0.5" opacity="0.07"/>
    <line x1="1008" y1="0" x2="1008" y2="396" stroke="#C9A84C" stroke-width="0.5" opacity="0.07"/>
    <line x1="1120" y1="0" x2="1120" y2="396" stroke="#C9A84C" stroke-width="0.5" opacity="0.07"/>
    <line x1="1232" y1="0" x2="1232" y2="396" stroke="#C9A84C" stroke-width="0.5" opacity="0.07"/>
    <line x1="1344" y1="0" x2="1344" y2="396" stroke="#C9A84C" stroke-width="0.5" opacity="0.07"/>
    <line x1="1456" y1="0" x2="1456" y2="396" stroke="#C9A84C" stroke-width="0.5" opacity="0.07"/>

    <!-- Radial teal orb (left side behind seal) -->
    <ellipse cx="280" cy="198" rx="340" ry="280" fill="#2B8A6E" opacity="0.07"/>
    <!-- Radial gold orb (right side) -->
    <ellipse cx="1380" cy="100" rx="400" ry="300" fill="#C9A84C" opacity="0.05"/>

    <!-- ── Seal (left, centered vertically) ─────────────────── -->
    <!-- Seal group translated to center-left: cx=240, cy=198, radius=130 -->
    <g transform="translate(240,198)">

      <!-- Background circle -->
      <circle r="130" fill="url(#sealGrad)"/>

      <!-- Outer rings -->
      <circle r="133" fill="none" stroke="#C9A84C" stroke-width="1.5"  opacity="0.85"/>
      <circle r="127" fill="none" stroke="#00E5C4" stroke-width="0.8"  opacity="0.25"/>
      <circle r="123" fill="none" stroke="#C9A84C" stroke-width="0.6"  opacity="0.2"/>
      <circle r="124" fill="none" stroke="#00E5C4" stroke-width="0.6"  stroke-dasharray="15 45" opacity="0.1"/>

      <!-- Tick marks (36) — scaled from r=86 base to r=130 -->
      <line x1="0"     y1="-135" x2="0"     y2="-121" stroke="#C9A84C" stroke-width="2"   opacity="0.85"/>
      <line x1="23.12" y1="-133.02" x2="22.01" y2="-120.06" stroke="#00E5C4" stroke-width="0.8" opacity="0.22"/>
      <line x1="45.50" y1="-127.22" x2="43.22" y2="-114.78" stroke="#00E5C4" stroke-width="0.8" opacity="0.22"/>
      <line x1="66.36" y1="-117.22" x2="62.52" y2="-105.43" stroke="#00E5C4" stroke-width="0.8" opacity="0.22"/>
      <line x1="84.99" y1="-103.13" x2="79.87" y2="-92.55" stroke="#00E5C4" stroke-width="0.8" opacity="0.22"/>
      <line x1="100.84" y1="-85.74" x2="94.44" y2="-76.68" stroke="#00E5C4" stroke-width="0.8" opacity="0.22"/>
      <line x1="113.31" y1="-65.50" x2="105.93" y2="-58.19" stroke="#00E5C4" stroke-width="0.8" opacity="0.22"/>
      <line x1="121.97" y1="-43.18" x2="114.02" y2="-37.70" stroke="#00E5C4" stroke-width="0.8" opacity="0.22"/>
      <line x1="126.70" y1="-19.45" x2="118.50" y2="-16.60" stroke="#00E5C4" stroke-width="0.8" opacity="0.22"/>
      <line x1="135"    y1="0"     x2="121"    y2="0"      stroke="#C9A84C" stroke-width="2"   opacity="0.85"/>
      <line x1="126.70" y1="19.45" x2="118.50" y2="16.60"  stroke="#00E5C4" stroke-width="0.8" opacity="0.22"/>
      <line x1="121.97" y1="43.18" x2="114.02" y2="37.70"  stroke="#00E5C4" stroke-width="0.8" opacity="0.22"/>
      <line x1="113.31" y1="65.50" x2="105.93" y2="58.19"  stroke="#00E5C4" stroke-width="0.8" opacity="0.22"/>
      <line x1="100.84" y1="85.74" x2="94.44"  y2="76.68"  stroke="#00E5C4" stroke-width="0.8" opacity="0.22"/>
      <line x1="84.99"  y1="103.13" x2="79.87" y2="92.55"  stroke="#00E5C4" stroke-width="0.8" opacity="0.22"/>
      <line x1="66.36"  y1="117.22" x2="62.52" y2="105.43" stroke="#00E5C4" stroke-width="0.8" opacity="0.22"/>
      <line x1="45.50"  y1="127.22" x2="43.22" y2="114.78" stroke="#00E5C4" stroke-width="0.8" opacity="0.22"/>
      <line x1="23.12"  y1="133.02" x2="22.01" y2="120.06" stroke="#00E5C4" stroke-width="0.8" opacity="0.22"/>
      <line x1="0"      y1="135"   x2="0"      y2="121"    stroke="#C9A84C" stroke-width="2"   opacity="0.85"/>
      <line x1="-23.12" y1="133.02" x2="-22.01" y2="120.06" stroke="#00E5C4" stroke-width="0.8" opacity="0.22"/>
      <line x1="-45.50" y1="127.22" x2="-43.22" y2="114.78" stroke="#00E5C4" stroke-width="0.8" opacity="0.22"/>
      <line x1="-66.36" y1="117.22" x2="-62.52" y2="105.43" stroke="#00E5C4" stroke-width="0.8" opacity="0.22"/>
      <line x1="-84.99" y1="103.13" x2="-79.87" y2="92.55"  stroke="#00E5C4" stroke-width="0.8" opacity="0.22"/>
      <line x1="-100.84" y1="85.74" x2="-94.44" y2="76.68"  stroke="#00E5C4" stroke-width="0.8" opacity="0.22"/>
      <line x1="-113.31" y1="65.50" x2="-105.93" y2="58.19" stroke="#00E5C4" stroke-width="0.8" opacity="0.22"/>
      <line x1="-121.97" y1="43.18" x2="-114.02" y2="37.70" stroke="#00E5C4" stroke-width="0.8" opacity="0.22"/>
      <line x1="-126.70" y1="19.45" x2="-118.50" y2="16.60" stroke="#00E5C4" stroke-width="0.8" opacity="0.22"/>
      <line x1="-135"    y1="0"    x2="-121"    y2="0"      stroke="#C9A84C" stroke-width="2"   opacity="0.85"/>
      <line x1="-126.70" y1="-19.45" x2="-118.50" y2="-16.60" stroke="#00E5C4" stroke-width="0.8" opacity="0.22"/>
      <line x1="-121.97" y1="-43.18" x2="-114.02" y2="-37.70" stroke="#00E5C4" stroke-width="0.8" opacity="0.22"/>
      <line x1="-113.31" y1="-65.50" x2="-105.93" y2="-58.19" stroke="#00E5C4" stroke-width="0.8" opacity="0.22"/>
      <line x1="-100.84" y1="-85.74" x2="-94.44" y2="-76.68" stroke="#00E5C4" stroke-width="0.8" opacity="0.22"/>
      <line x1="-84.99"  y1="-103.13" x2="-79.87" y2="-92.55" stroke="#00E5C4" stroke-width="0.8" opacity="0.22"/>
      <line x1="-66.36"  y1="-117.22" x2="-62.52" y2="-105.43" stroke="#00E5C4" stroke-width="0.8" opacity="0.22"/>
      <line x1="-45.50"  y1="-127.22" x2="-43.22" y2="-114.78" stroke="#00E5C4" stroke-width="0.8" opacity="0.22"/>
      <line x1="-23.12"  y1="-133.02" x2="-22.01" y2="-120.06" stroke="#00E5C4" stroke-width="0.8" opacity="0.22"/>

      <!-- Cardinal diamonds -->
      <polygon points="0,-141 6,-135 0,-129 -6,-135" fill="url(#goldG)"/>
      <polygon points="141,-6 135,0 141,6 147,0"     fill="url(#goldG)"/>
      <polygon points="0,129 6,135 0,141 -6,135"     fill="url(#goldG)"/>
      <polygon points="-141,-6 -135,0 -141,6 -147,0" fill="url(#goldG)"/>

      <!-- Radar sweep (SMIL) -->
      <g>
        <path d="M 0,0 L 0,-117 A 117,117 0 0,1 50.30,-105.92 Z"
          fill="#00E5C4" opacity="0.08"/>
        <line x1="0" y1="0" x2="0" y2="-117"
          stroke="#00E5C4" stroke-width="2" opacity="0.7" filter="url(#glow)"/>
        <animateTransform
          attributeName="transform"
          type="rotate"
          from="0 0 0"
          to="360 0 0"
          dur="12s"
          repeatCount="indefinite"/>
      </g>

      <!-- VM monogram -->
      <text x="0" y="21" text-anchor="middle"
        font-family="Georgia, serif"
        font-size="78" font-weight="700"
        fill="url(#goldG)"
        filter="url(#glow)"
        letter-spacing="-3">VM</text>

      <!-- Signal pulse dot — synced to 12s radar; flashes at 6s when beam sweeps past -->
      <circle cx="0" cy="85" r="5" fill="#00E5C4" filter="url(#glow)">
        <animate attributeName="opacity"
          values="0.2;0.2;0.2;1.0;0.2;0.2;0.2"
          keyTimes="0;0.42;0.47;0.50;0.53;0.58;1"
          dur="12s" repeatCount="indefinite"/>
        <animate attributeName="r"
          values="4;4;4;8;4;4;4"
          keyTimes="0;0.42;0.47;0.50;0.53;0.58;1"
          dur="12s" repeatCount="indefinite"/>
      </circle>

      <!-- Top arc text -->
      <path id="sTop" d="M -107,0 A 107,107 0 0,1 107,0" fill="none"/>
      <text font-family="'Courier New', monospace" font-size="16.5"
        fill="#C9A84C" opacity="0.85" text-anchor="middle">
        <textPath href="#sTop" startOffset="50%">VAUGHNMARTIN · READINESS OS</textPath>
      </text>

      <!-- Bottom arc text -->
      <path id="sBot" d="M -96,0 A 96,96 0 0,0 96,0" fill="none"/>
      <text font-family="'Courier New', monospace" font-size="14"
        fill="#3BAF8A" opacity="0.7" text-anchor="middle">
        <textPath href="#sBot" startOffset="50%">ANTE IGNEM PARATUS</textPath>
      </text>

    </g><!-- /seal group -->

    <!-- ── Vertical divider ───────────────────────────────────── -->
    <line x1="430" y1="60" x2="430" y2="336" stroke="#C9A84C" stroke-width="0.75" opacity="0.3"/>

    <!-- ── Right side: wordmark + homepage motto treatment ──── -->

    <!-- VaughnMartin wordmark -->
    <text x="490" y="148"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="88" font-weight="700"
      fill="#F0EDE4"
      letter-spacing="-1">VaughnMartin</text>

    <!-- Gold rule under wordmark -->
    <rect x="490" y="164" width="72" height="1.5" fill="#C9A84C" opacity="0.9"/>

    <!-- READINESS OS sub-label -->
    <text x="490" y="188"
      font-family="'Courier New', monospace"
      font-size="13" font-weight="700"
      fill="#C9A84C"
      letter-spacing="0.36em">READINESS OS</text>

    <!-- Gold bar — ANTE IGNEM PARATUS (matches homepage treatment exactly) -->
    <rect x="490" y="218" width="432" height="40" fill="url(#mottoGrad)"/>
    <text x="706" y="244"
      text-anchor="middle"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="14" font-weight="700"
      fill="#0A0F2E"
      letter-spacing="0.32em">ANTE IGNEM PARATUS</text>

    <!-- Teal motto line — PREPARE · PRACTICE · PERFORM FEARLESS · NEVER GIVE UP -->
    <text x="706" y="286"
      text-anchor="middle"
      font-family="'Courier New', monospace"
      font-size="11.5" font-weight="600"
      fill="rgba(0,229,196,0.65)"
      letter-spacing="0.16em">PREPARE · PRACTICE · PERFORM FEARLESS · NEVER GIVE UP</text>

    <!-- Tagline -->
    <text x="490" y="336"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="22" font-weight="400"
      fill="rgba(240,237,228,0.72)"
      font-style="italic">The Response Is Ready Before the Trigger Fires.</text>

    <!-- Bottom-right URL -->
    <text x="1540" y="374"
      text-anchor="end"
      font-family="'Courier New', monospace"
      font-size="12"
      fill="#C9A84C"
      opacity="0.5"
      letter-spacing="0.05em">vaughnmartin.com</text>

  </g>
</svg>
