<?xml version="1.0" encoding="UTF-8"?>
<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sbg" cx="50%" cy="38%" r="65%">
      <stop offset="0%"  stop-color="#1e2e70"/>
      <stop offset="100%" stop-color="#0A0F2E"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#DFC178"/>
      <stop offset="50%"  stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#8B6212"/>
    </linearGradient>
    <linearGradient id="barG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#7a5510"/>
      <stop offset="50%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#7a5510"/>
    </linearGradient>
    <filter id="gw">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="300" height="300" fill="#0A0F2E"/>

  <!-- Seal disc  cx=150 cy=112 r=100 -->
  <circle cx="150" cy="112" r="100" fill="url(#sbg)"/>
  <!-- Rings -->
  <circle cx="150" cy="112" r="102" fill="none" stroke="#C9A84C" stroke-width="1.2"  opacity="0.85"/>
  <circle cx="150" cy="112" r="98"  fill="none" stroke="#00E5C4" stroke-width="0.7"  opacity="0.25"/>
  <circle cx="150" cy="112" r="95"  fill="none" stroke="#C9A84C" stroke-width="0.45" opacity="0.2"/>

  <!-- 36 tick marks (major at 0°/90°/180°/270°, minor elsewhere) -->
  <!-- 0° top — major -->
  <line x1="150" y1="10"  x2="150" y2="18"  stroke="#C9A84C" stroke-width="1.7" opacity="0.85"/>
  <!-- 10° -->
  <line x1="167.7" y1="11.6" x2="166.8" y2="16.5" stroke="#00E5C4" stroke-width="0.65" opacity="0.22"/>
  <!-- 20° -->
  <line x1="184.9" y1="16.2" x2="183.3" y2="20.8" stroke="#00E5C4" stroke-width="0.65" opacity="0.22"/>
  <!-- 30° -->
  <line x1="201"   y1="23.7" x2="198.5" y2="28.3" stroke="#00E5C4" stroke-width="0.65" opacity="0.22"/>
  <!-- 40° -->
  <line x1="215.6" y1="33.9" x2="212.3" y2="37.4" stroke="#00E5C4" stroke-width="0.65" opacity="0.22"/>
  <!-- 50° -->
  <line x1="228.1" y1="46.4" x2="224.3" y2="49.7" stroke="#00E5C4" stroke-width="0.65" opacity="0.22"/>
  <!-- 60° -->
  <line x1="238.3" y1="61"   x2="233.9" y2="63.5" stroke="#00E5C4" stroke-width="0.65" opacity="0.22"/>
  <!-- 70° -->
  <line x1="245.8" y1="77.1" x2="241.1" y2="78.8" stroke="#00E5C4" stroke-width="0.65" opacity="0.22"/>
  <!-- 80° -->
  <line x1="250.4" y1="94.3" x2="245.5" y2="95.2" stroke="#00E5C4" stroke-width="0.65" opacity="0.22"/>
  <!-- 90° right — major -->
  <line x1="252" y1="112" x2="244" y2="112" stroke="#C9A84C" stroke-width="1.7" opacity="0.85"/>
  <!-- 100° -->
  <line x1="250.4" y1="129.7" x2="245.5" y2="128.8" stroke="#00E5C4" stroke-width="0.65" opacity="0.22"/>
  <!-- 110° -->
  <line x1="245.8" y1="146.9" x2="241.1" y2="145.2" stroke="#00E5C4" stroke-width="0.65" opacity="0.22"/>
  <!-- 120° -->
  <line x1="238.3" y1="163"   x2="233.9" y2="160.5" stroke="#00E5C4" stroke-width="0.65" opacity="0.22"/>
  <!-- 130° -->
  <line x1="228.1" y1="177.6" x2="224.3" y2="174.4" stroke="#00E5C4" stroke-width="0.65" opacity="0.22"/>
  <!-- 140° -->
  <line x1="215.6" y1="190.1" x2="212.4" y2="186.3" stroke="#00E5C4" stroke-width="0.65" opacity="0.22"/>
  <!-- 150° -->
  <line x1="201"   y1="200.3" x2="198.5" y2="196.1" stroke="#00E5C4" stroke-width="0.65" opacity="0.22"/>
  <!-- 160° -->
  <line x1="184.9" y1="207.8" x2="183.2" y2="203.2" stroke="#00E5C4" stroke-width="0.65" opacity="0.22"/>
  <!-- 170° -->
  <line x1="167.7" y1="212.4" x2="166.8" y2="207.5" stroke="#00E5C4" stroke-width="0.65" opacity="0.22"/>
  <!-- 180° bottom — major -->
  <line x1="150" y1="214" x2="150" y2="206" stroke="#C9A84C" stroke-width="1.7" opacity="0.85"/>
  <!-- 190° -->
  <line x1="132.3" y1="212.4" x2="133.2" y2="207.5" stroke="#00E5C4" stroke-width="0.65" opacity="0.22"/>
  <!-- 200° -->
  <line x1="115.1" y1="207.8" x2="116.8" y2="203.2" stroke="#00E5C4" stroke-width="0.65" opacity="0.22"/>
  <!-- 210° -->
  <line x1="99"    y1="200.3" x2="101.5" y2="196.1" stroke="#00E5C4" stroke-width="0.65" opacity="0.22"/>
  <!-- 220° -->
  <line x1="84.4"  y1="190.1" x2="87.6"  y2="186.3" stroke="#00E5C4" stroke-width="0.65" opacity="0.22"/>
  <!-- 230° -->
  <line x1="71.9"  y1="177.6" x2="75.7"  y2="174.4" stroke="#00E5C4" stroke-width="0.65" opacity="0.22"/>
  <!-- 240° -->
  <line x1="61.7"  y1="163"   x2="66.1"  y2="160.5" stroke="#00E5C4" stroke-width="0.65" opacity="0.22"/>
  <!-- 250° -->
  <line x1="54.2"  y1="146.9" x2="58.9"  y2="145.2" stroke="#00E5C4" stroke-width="0.65" opacity="0.22"/>
  <!-- 260° -->
  <line x1="49.6"  y1="129.7" x2="54.5"  y2="128.8" stroke="#00E5C4" stroke-width="0.65" opacity="0.22"/>
  <!-- 270° left — major -->
  <line x1="48" y1="112" x2="56" y2="112" stroke="#C9A84C" stroke-width="1.7" opacity="0.85"/>
  <!-- 280° -->
  <line x1="49.6"  y1="94.3" x2="54.5"  y2="95.2"  stroke="#00E5C4" stroke-width="0.65" opacity="0.22"/>
  <!-- 290° -->
  <line x1="54.2"  y1="77.1" x2="58.9"  y2="78.8"  stroke="#00E5C4" stroke-width="0.65" opacity="0.22"/>
  <!-- 300° -->
  <line x1="61.7"  y1="61"   x2="66.1"  y2="63.5"  stroke="#00E5C4" stroke-width="0.65" opacity="0.22"/>
  <!-- 310° -->
  <line x1="71.9"  y1="46.4" x2="75.7"  y2="49.7"  stroke="#00E5C4" stroke-width="0.65" opacity="0.22"/>
  <!-- 320° -->
  <line x1="84.4"  y1="33.9" x2="87.6"  y2="37.4"  stroke="#00E5C4" stroke-width="0.65" opacity="0.22"/>
  <!-- 330° -->
  <line x1="99"    y1="23.7" x2="101.5" y2="28.3"  stroke="#00E5C4" stroke-width="0.65" opacity="0.22"/>
  <!-- 340° -->
  <line x1="115.1" y1="16.2" x2="116.8" y2="20.8"  stroke="#00E5C4" stroke-width="0.65" opacity="0.22"/>
  <!-- 350° -->
  <line x1="132.3" y1="11.6" x2="133.2" y2="16.5"  stroke="#00E5C4" stroke-width="0.65" opacity="0.22"/>

  <!-- Cardinal diamonds at r+6=106 from center -->
  <polygon points="150,4  155,10  150,16  145,10"  fill="url(#gold)"/>
  <polygon points="244,107 250,112 244,117 238,112" fill="url(#gold)"/>
  <polygon points="150,208 155,214 150,220 145,214" fill="url(#gold)"/>
  <polygon points="56,107  50,112  56,117  62,112"  fill="url(#gold)"/>

  <!-- Radar sweep line (static position — 12 o'clock) -->
  <g filter="url(#gw)">
    <path d="M 150,112 L 150,22 A 90,90 0 0,1 188,30 Z" fill="#00E5C4" opacity="0.07"/>
    <line x1="150" y1="112" x2="150" y2="22" stroke="#00E5C4" stroke-width="1.8" opacity="0.7"/>
    <animateTransform attributeName="transform" type="rotate" from="0 150 112" to="360 150 112" dur="12s" repeatCount="indefinite"/>
  </g>

  <!-- VM monogram -->
  <text x="150" y="132" text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="60" font-weight="700"
    fill="url(#gold)" filter="url(#gw)" letter-spacing="-3">VM</text>

  <!-- Pulse dot at bottom of seal -->
  <circle cx="150" cy="177" r="4.2" fill="#00E5C4" filter="url(#gw)">
    <animate attributeName="opacity" values="0.15;0.15;0.15;1;0.15;0.15;0.15" keyTimes="0;0.42;0.47;0.50;0.53;0.58;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="r"       values="3.5;3.5;3.5;6;3.5;3.5;3.5"      keyTimes="0;0.42;0.47;0.50;0.53;0.58;1" dur="12s" repeatCount="indefinite"/>
  </circle>

  <!-- Top arc text: VAUGHNMARTIN · READINESS OS -->
  <path id="ta" d="M 68,112 A 82,82 0 0,1 232,112" fill="none"/>
  <text font-family="Georgia, serif" font-size="12" fill="#C9A84C" opacity="0.9" text-anchor="middle">
    <textPath href="#ta" startOffset="50%">VAUGHNMARTIN  ·  READINESS OS</textPath>
  </text>

  <!-- Bottom arc text: ANTE IGNEM PARATUS -->
  <path id="ba" d="M 76,112 A 74,74 0 0,0 224,112" fill="none"/>
  <text font-family="Georgia, serif" font-size="11" fill="#3BAF8A" opacity="0.75" text-anchor="middle">
    <textPath href="#ba" startOffset="50%">ANTE IGNEM PARATUS</textPath>
  </text>

  <!-- Gold bar -->
  <rect x="10" y="220" width="280" height="42" fill="url(#barG)"/>
  <text x="150" y="247" text-anchor="middle"
    font-family="Georgia, serif" font-size="13.5" font-weight="700"
    fill="#0A0F2E" letter-spacing="4">ANTE IGNEM PARATUS</text>

  <!-- Teal motto -->
  <text x="150" y="273" text-anchor="middle"
    font-family="Georgia, serif" font-size="7" fill="#00E5C4" opacity="0.6" letter-spacing="1">PREPARE · PRACTICE · PERFORM FEARLESS · NEVER GIVE UP</text>

  <!-- READINESS OS -->
  <text x="150" y="292" text-anchor="middle"
    font-family="Georgia, serif" font-size="9.5" fill="#C9A84C" opacity="0.5" letter-spacing="4">READINESS OS</text>

</svg>
