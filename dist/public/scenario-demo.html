function clearTimers(){timers.forEach(t=>{clearInterval(t);clearTimeout(t)});timers=[];}
function reset(){clearTimers();state={phase:'welcome',track:null,scenario:null,timelineStep:0,showFeature:null};render();}
function getS(){return state.scenario?scenarios[state.scenario]:null;}

function selectTrack(t){state.track=t;state.phase='scenarios';render();}
function selectScenario(id){state.scenario=id;state.phase='problem';render();}
function showTimeline(){state.phase='timeline';state.timelineStep=0;render();animateTimeline();}
function showComparison(){state.phase='comparison';render();}
function showPlatform(){state.phase='platform';render();}

function animateTimeline(){
  const s=getS();
  let step=0;
  const interval=setInterval(()=>{
    step++;
    state.timelineStep=step;
    render();
    if(step>=s.withTimeline.length){
      clearInterval(interval);
    }
  },800);
  timers.push(interval);
}

  let html='';
  switch(state.phase){
    case 'welcome':html=renderWelcome();break;
    case 'scenarios':html=renderScenarios();break;
    case 'problem':html=renderProblem();break;
    case 'timeline':html=renderTimeline();break;
    case 'comparison':html=renderComparison();break;
    case 'platform':html=renderPlatform();break;
  }
  app.innerHTML=html;
}
