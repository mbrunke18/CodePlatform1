name: Pre-Production Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'

# ─── PR: smoke gate (fast, blocks merge) ─────────────────────────────────────
jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run unit tests
        run: npm run test
        env:
          CI: true

  smoke:
    name: Smoke Suite
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run smoke suite
        run: npm run test:e2e:smoke
        env:
          BASE_URL: http://localhost:5000
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-report
          path: playwright-report/
          retention-days: 7

# ─── Merge / nightly: full gate (must pass before production is safe) ─────────
  full-e2e:
    name: Full E2E Suite
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule'
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps
      - name: Run full E2E suite
        run: npm run test:e2e:full
        env:
          BASE_URL: http://localhost:5000
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: full-e2e-report
          path: playwright-report/
          retention-days: 14

  production-gate:
    name: Production Gate — All Tests Passed
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule'
    needs: [unit-tests, full-e2e]
    steps:
      - name: All tests passed — safe to deploy
        run: echo "✅ Unit tests + full E2E passed. Production deployment is cleared."
