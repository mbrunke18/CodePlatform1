<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Barlow+Condensed:wght@700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    width:800px;height:800px;
    background:#0A0F2E;
    display:flex;align-items:center;justify-content:center;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;
  }
  #logo-wrap{display:flex;align-items:center;gap:22px}
  #wordmark{display:flex;flex-direction:column;line-height:1}
  #wm-name{
    font-family:'Cormorant Garamond',Georgia,serif;
    font-weight:600;font-size:42px;
    color:#FDFCFA;letter-spacing:0.015em;line-height:1;
  }
  #wm-row{display:flex;align-items:center;gap:10px;margin-top:5px}
  #wm-rule{width:30px;height:1px;background:#DFC178;flex-shrink:0}
  #wm-sub{
    font-family:'Barlow Condensed',Arial,sans-serif;
    font-weight:700;font-size:15px;
    letter-spacing:0.34em;text-transform:uppercase;
    color:#DFC178;
  }
</style>
</head>
<body>
<div id="logo-wrap">
  <svg id="seal" width="280" height="280" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="wordmark">
    <span id="wm-name">VaughnMartin</span>
    <div id="wm-row">
      <div id="wm-rule"></div>
      <span id="wm-sub">Readiness OS</span>
    </div>
  </div>
</div>
<script>
(function(){
  const NAVY   = '#0A0F2E';
  const GOLD   = '#C9A84C';
  const GOLD_LT= '#DFC178';
  const TEAL_LT= '#3BAF8A';
  const SIGNAL = '#00E5C4';

  const svg = document.getElementById('seal');
  const ns  = 'http://www.w3.org/2000/svg';

  const cx=100, cy=100, r=86;

  function el(tag, attrs, parent){
    const e = document.createElementNS(ns, tag);
    for(const [k,v] of Object.entries(attrs)) e.setAttribute(k,v);
    if(parent) parent.appendChild(e);
    return e;
  }

  // ── defs ──────────────────────────────────────────
  const defs = el('defs',{},svg);

  const rg = el('radialGradient',{id:'rg',cx:'50%',cy:'30%',r:'70%'},defs);
  el('stop',{offset:'0%','stop-color':'#1a2860'},rg);
  el('stop',{offset:'100%','stop-color':NAVY},rg);

  const gg = el('linearGradient',{id:'gg',x1:'0%',y1:'0%',x2:'100%',y2:'100%'},defs);
  el('stop',{offset:'0%','stop-color':GOLD_LT},gg);
  el('stop',{offset:'50%','stop-color':GOLD},gg);
  el('stop',{offset:'100%','stop-color':'#8B6212'},gg);

  const glow = el('filter',{id:'glow'},defs);
  el('feGaussianBlur',{stdDeviation:'1.2',result:'blur'},glow);
  const merge = el('feMerge',{},glow);
  el('feMergeNode',{in:'blur'},merge);
  el('feMergeNode',{in:'SourceGraphic'},merge);

  // path defs for arced text
  const topArcPath = el('path',{id:'ta',
    d:`M ${cx-r*0.82},${cy} A ${r*0.82},${r*0.82} 0 0,1 ${cx+r*0.82},${cy}`,
    fill:'none'},defs);

  const botArcPath = el('path',{id:'ba',
    d:`M ${cx-r*0.74},${cy} A ${r*0.74},${r*0.74} 0 0,0 ${cx+r*0.74},${cy}`,
    fill:'none'},defs);

  // ── background fill ────────────────────────────────
  el('circle',{cx,cy,r,fill:'url(#rg)'},svg);

  // ── rings ──────────────────────────────────────────
  el('circle',{cx,cy,r:r+2,fill:'none',stroke:GOLD,  'stroke-width':'1',  opacity:'0.85'},svg);
  el('circle',{cx,cy,r:r-2,fill:'none',stroke:SIGNAL,'stroke-width':'0.6',opacity:'0.25'},svg);
  el('circle',{cx,cy,r:r-5,fill:'none',stroke:GOLD,  'stroke-width':'0.4',opacity:'0.2'},svg);
  el('circle',{cx,cy,r:r-4,fill:'none',stroke:SIGNAL,'stroke-width':'0.4',
    'stroke-dasharray':'10 30',opacity:'0.1'},svg);

  // ── 36 tick marks ──────────────────────────────────
  for(let i=0;i<36;i++){
    const a  = (i*10-90)*Math.PI/180;
    const r1 = r+2;
    const r2 = i%9===0 ? r-6 : r-3;
    el('line',{
      x1: cx+r1*Math.cos(a), y1: cy+r1*Math.sin(a),
      x2: cx+r2*Math.cos(a), y2: cy+r2*Math.sin(a),
      stroke:   i%9===0 ? GOLD : SIGNAL,
      'stroke-width': i%9===0 ? '1.5' : '0.6',
      opacity:  i%9===0 ? '0.85' : '0.22',
    },svg);
  }

  // ── cardinal diamonds N S E W ──────────────────────
  [0,90,180,270].forEach(deg=>{
    const rad = (deg-90)*Math.PI/180;
    const dx  = cx+(r+6)*Math.cos(rad);
    const dy  = cy+(r+6)*Math.sin(rad);
    const d   = 4;
    el('polygon',{
      points:`${dx},${dy-d} ${dx+d},${dy} ${dx},${dy+d} ${dx-d},${dy}`,
      fill:'url(#gg)',
    },svg);
  });

  // ── VM monogram ────────────────────────────────────
  const vmText = el('text',{
    x:cx, y:cy+14,
    'text-anchor':'middle',
    'font-family':'Georgia, serif',
    'font-size':'52',
    'font-weight':'700',
    fill:'url(#gg)',
    filter:'url(#glow)',
    'letter-spacing':'-2',
  },svg);
  vmText.textContent = 'VM';

  // ── signal pulse dot at 6 o'clock ─────────────────
  el('circle',{cx,cy:cy+56,r:'3.6',fill:SIGNAL,opacity:'0.8',filter:'url(#glow)'},svg);

  // ── top arc text: VAUGHNMARTIN · READINESS OS ─────
  const topT = el('text',{
    'font-family':"'Courier New', monospace",
    'font-size':'11',
    fill:GOLD,
    opacity:'0.85',
    'text-anchor':'middle',
  },svg);
  const topTP = el('textPath',{'href':'#ta','startOffset':'50%'},topT);
  topTP.textContent = 'VAUGHNMARTIN · READINESS OS';

  // ── bottom arc text: ANTE IGNEM PARATUS ───────────
  const botT = el('text',{
    'font-family':"'Courier New', monospace",
    'font-size':'9.5',
    fill:TEAL_LT,
    opacity:'0.7',
    'text-anchor':'middle',
  },svg);
  const botTP = el('textPath',{'href':'#ba','startOffset':'50%'},botT);
  botTP.textContent = 'ANTE IGNEM PARATUS';
})();
</script>
</body>
</html>
