    // Helper functions
    function getScenario() {
      return state.selectedScenario ? scenarios[state.selectedScenario] : null;
    }

    function getColorClasses(color) {
      const colors = {
        red: { bg: 'bg-red-500', light: 'bg-red-500/20', border: 'border-red-500', text: 'text-red-400' },
        blue: { bg: 'bg-blue-500', light: 'bg-blue-500/20', border: 'border-blue-500', text: 'text-blue-400' },
        purple: { bg: 'bg-purple-500', light: 'bg-purple-500/20', border: 'border-purple-500', text: 'text-purple-400' },
        teal: { bg: 'bg-teal-500', light: 'bg-teal-500/20', border: 'border-teal-500', text: 'text-teal-400' },
      };
      return colors[color] || colors.teal;
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function clearTimers() {
      if (chaosInterval) clearInterval(chaosInterval);
      if (chaosTimeout) clearTimeout(chaosTimeout);
      if (ideaInterval) clearInterval(ideaInterval);
    }

    function resetState() {
      clearTimers();
      state = {
        phase: 'welcome',
        selectedScenario: null,
        chaosMessageIndex: 0,
        ideaPhase: -1,
        progress: 0,
        elapsedSeconds: 0,
        stakeholdersAcked: [],
        tasksCompleted: [],
        notifications: [],
        aiMessages: [],
        showPlaybook: false,
        showRaci: false,
      };
      render();
    }

    // Phase handlers
    function startChaos(scenarioId) {
      state.selectedScenario = scenarioId;
      state.chaosMessageIndex = 0;
      state.phase = 'chaos';
      render();

      const scenario = getScenario();
      chaosInterval = setInterval(() => {
        if (state.chaosMessageIndex < scenario.chaosMessages.length - 1) {
          state.chaosMessageIndex++;
          render();
        }
      }, 1200);

      chaosTimeout = setTimeout(() => {
        clearInterval(chaosInterval);
        state.phase = 'bridge';
        render();
      }, scenario.chaosMessages.length * 1200 + 2000);
    }

    function startActivation() {
      state.phase = 'activation';
      state.stakeholdersAcked = [];
      state.tasksCompleted = [];
      state.notifications = [];
      state.aiMessages = [];
      state.progress = 0;
      state.elapsedSeconds = 0;
      state.ideaPhase = -1;
      render();

      const scenario = getScenario();
      const ackQueue = [...scenario.stakeholders].sort((a, b) => a.ackTime - b.ackTime);
      const aiQueue = [
        { time: 1, msg: '✦ Signal received. Analyzing pattern against 166 playbooks...' },
        { time: 3, msg: '✦ Pattern match found: ' + scenario.playbook.name + ' (98.7% confidence)' },
        { time: 5, msg: '✦ Auto-generating RACI matrix for ' + scenario.stakeholders.length + ' stakeholders...' },
        { time: 8, msg: '✦ Creating task assignments based on playbook best practices...' },
        { time: 12, msg: '✦ Routing notifications via Slack, Email, SMS, and Teams...' },
        { time: 20, msg: '✦ Monitoring stakeholder acknowledgments in real-time...' },
        { time: 40, msg: '✦ 80% coordination threshold reached. Execution proceeding nominally.' },
        { time: 60, msg: '✦ All critical stakeholders acknowledged. Full coordination achieved.' },
      ];

      let elapsed = 0;
      ideaInterval = setInterval(() => {
        elapsed += 0.5;
        state.elapsedSeconds = Math.floor(elapsed);

        // Progress through IDEA phases
        if (elapsed < 8) {
          state.ideaPhase = 0;
          state.progress = (elapsed / 8) * 25;
        } else if (elapsed < 16) {
          state.ideaPhase = 1;
          state.progress = 25 + ((elapsed - 8) / 8) * 25;
        } else if (elapsed < 50) {
          state.ideaPhase = 2;
          state.progress = 50 + ((elapsed - 16) / 34) * 40;
        } else {
          state.ideaPhase = 3;
          state.progress = 90 + ((elapsed - 50) / 20) * 10;
        }

        // Add AI messages
        aiQueue.forEach(ai => {
          if (elapsed >= ai.time && !state.aiMessages.includes(ai.msg)) {
            state.aiMessages.push(ai.msg);
          }
        });

        // Acknowledge stakeholders
        ackQueue.forEach(s => {
          if (elapsed >= s.ackTime / 10 && !state.stakeholdersAcked.find(a => a.id === s.id)) {
            state.stakeholdersAcked.push(s);
            state.notifications.push({
              type: 'ack',
              name: s.name,
              role: s.role,
              time: Math.floor(elapsed)
            });
          }
        });

        // Complete tasks
        if (elapsed > 20) {
          const taskInterval = 5;
          const tasksToComplete = Math.min(Math.floor((elapsed - 20) / taskInterval), scenario.tasks.length);
          for (let i = 0; i < tasksToComplete; i++) {
            if (!state.tasksCompleted.find(t => t.id === scenario.tasks[i].id)) {
              state.tasksCompleted.push(scenario.tasks[i]);
            }
          }
        }

        render();

        // Complete demo
        if (elapsed >= 70) {
          clearInterval(ideaInterval);
          setTimeout(() => {
            state.phase = 'command-center';
            render();
          }, 500);
        }
      }, 500);
    }

        phaseCards += `
          <div class="p-3 rounded-lg border transition-all ${isComplete ? 'bg-teal-500/20 border-teal-500' : isActive ? 'bg-teal-500/10 border-teal-500 animate-pulse-slow' : 'bg-slate-800/30 border-slate-700'}">

      let aiMessagesHtml = state.aiMessages.map(msg => `<div class="text-xs text-slate-300">${msg}</div>`).join('');

                <div class="bg-blue-500/10 border border-blue-500/30 rounded-lg p-3">
                  <div class="text-blue-400 text-xs font-semibold mb-1">CONSULTED</div>
